(() => {
  if (location.protocol !== "file:") return;
  // Reload same-name local assets after each page refresh; keep relative paths portable.
  function freshURL(value,token){
    if(!value||/^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(value))return value;
    const hashAt=value.indexOf('#'),hash=hashAt<0?'':value.slice(hashAt);
    const base=hashAt<0?value:value.slice(0,hashAt),queryAt=base.indexOf('?');
    const path=queryAt<0?base:base.slice(0,queryAt);
    const query=new URLSearchParams(queryAt<0?'':base.slice(queryAt+1));
    query.set('_refresh',token);
    return path+'?'+query.toString()+hash;
  }
  function refreshAssets(includeStyles){
    const token=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
    const selector=includeStyles?'img[src],image[href],link[rel="stylesheet"][href]':'img[src],image[href]';
    document.querySelectorAll(selector).forEach(el=>{
      const attr=el.tagName==='LINK'||el.tagName.toLowerCase()==='image'?'href':'src';
      el.setAttribute(attr,freshURL(el.getAttribute(attr),token));
    });
  }
  refreshAssets(true);
  window.addEventListener('pageshow',event=>{if(event.persisted)refreshAssets(false)});
})();
